name: ShieldChain quality gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Policy regression tests
        run: npm run test:policy
      - name: CI contract preflight
        run: npm run ci:contract
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Static project preflight
        run: npm run preflight
      - name: Database schema preflight
        run: npm run db:preflight
      - name: Security regression preflight
        run: npm run security:preflight
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
